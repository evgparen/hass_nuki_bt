name: "Regression Tests"

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
